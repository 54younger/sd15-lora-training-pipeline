[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-lora-pipeline"
version = "0.1.0"
description = "A durable single-host image LoRA training pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "diffusers==0.35.1",
  "transformers==4.56.1", "peft==0.17.1", "accelerate==1.10.1",
  "safetensors==0.6.2", "huggingface-hub==0.34.4",
  "numpy==2.3.3", "Pillow==11.3.0", "ImageHash==4.3.2",
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.9",
  "httpx==0.28.1", "psutil==7.0.0", "prometheus-client==0.23.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2", "types-Pillow", "types-psutil"]

[project.scripts]
lora-pipeline = "lora_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["gpu: opt-in real CUDA/model-cache integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/lora_pipeline/common.py", "src/lora_pipeline/config.py"]
