services:
  api:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu128}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-300}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    environment:
      LORA_TEST_BACKEND: "0"
      LORA_FAKE_SLOTS: "0"
  worker:
    environment:
      LORA_TEST_BACKEND: "0"
      LORA_FAKE_SLOTS: "0"
    gpus: all
